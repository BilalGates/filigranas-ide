name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: TypeScript and Vite
        run: pnpm build
      - name: TypeScript tests
        run: pnpm test
      - name: Install Rust and Clippy
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Rust and Tauri tests
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo +stable clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  dependencies:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: pnpm audit
        run: pnpm audit --audit-level=high
      - name: RustSec audit
        if: ${{ !cancelled() }}
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-audit --version 0.23.0 --locked
          cargo audit --file src-tauri/Cargo.lock
