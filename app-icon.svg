<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1430"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <g clip-path="url(#frame)" stroke-linecap="round" stroke-linejoin="round">
    <!-- suelo -->
    <path d="M120 828 H900" stroke="#1f3266" stroke-width="10" fill="none"/>

    <!-- pierna de atrás (armando el golpeo) -->
    <path d="M370 150 L300 470" stroke="#d7deef" stroke-width="128" fill="none"/>
    <path d="M300 470 L215 615" stroke="#ef4a66" stroke-width="96" fill="none"/>
    <path d="M270 530 L250 560" stroke="#eef1fa" stroke-width="100" fill="none" opacity="0"/>
    <path d="M205 618 L268 708" stroke="#eef1fa" stroke-width="74" fill="none"/>

    <!-- pierna de apoyo -->
    <path d="M540 150 L560 480" stroke="#d7deef" stroke-width="132" fill="none"/>
    <path d="M560 480 L545 735" stroke="#ef4a66" stroke-width="100" fill="none"/>
    <path d="M532 790 L650 796" stroke="#eef1fa" stroke-width="72" fill="none"/>
    <path d="M520 760 L540 735" stroke="#eef1fa" stroke-width="84" fill="none"/>

    <!-- pantalón -->
    <path d="M220 40 H660 L640 300 Q560 330 480 290 Q420 320 300 300 Z" fill="#5b8ff0"/>
  </g>

  <!-- balón -->
  <circle cx="790" cy="728" r="100" fill="#eef1fa"/>
  <g fill="#070b18" opacity="0.85">
    <path d="M790 690 l34 25 -13 40 h-42 l-13 -40 z"/>
    <path d="M700 700 q10 -40 40 -60 l10 30 -28 34 z"/>
    <path d="M880 700 q-10 -40 -40 -60 l-10 30 28 34 z"/>
    <path d="M745 815 q45 15 90 0 l-15 -32 h-60 z"/>
  </g>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#1b2a55" stroke-width="8"/>
</svg>
