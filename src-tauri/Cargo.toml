[package]
name = "filigranas"
version = "0.1.0"
description = "Filigranas IDE"
edition = "2021"

[lib]
name = "filigranas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
p0-acceptance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
png = "0.18.1"
percent-encoding = "2"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
notify = "8.2.2"
dunce = "1.0.5"
portable-pty = "0.9.0"
uuid = { version = "1.29.2", features = ["v4"] }
tauri-plugin-updater = "=2.14.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
minisign-verify = "=0.3.0"
